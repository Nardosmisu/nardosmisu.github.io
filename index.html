<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nardos Mistire Wolde | Engineering &amp; Technical Work</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --subtle: #6b7280;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --accent: #0f172a;
      --link: #0369a1;
      --tag-bg: #f3f4f6;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 5rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      color: var(--accent);
    }

    .subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0 0 1.1rem;
    }

    .bio {
      font-size: 0.98rem;
      color: var(--text);
      margin: 0 0 1.35rem;
      max-width: 72ch;
    }

    .header-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      font-size: 0.92rem;
    }

    .header-links a {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    .header-links a:hover {
      border-bottom-color: var(--link);
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: var(--surface);
      color: var(--accent) !important;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .btn-link:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    section {
      margin-bottom: 2.75rem;
    }

    h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--subtle);
      margin: 0 0 1rem;
      font-weight: 600;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    details.project {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.2rem;
      transition: border-color 0.15s ease;
    }

    details.project:hover {
      border-color: var(--border-strong);
    }

    details.project[open] {
      border-color: #9ca3af;
    }

    summary.project-header {
      list-style: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    summary.project-header::-webkit-details-marker {
      display: none;
    }

    .project-title-wrap {
      flex: 1;
    }

    .project-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      margin: 0 0 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .project-title::before {
      content: "+";
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      color: var(--subtle);
      font-weight: 400;
      width: 1rem;
      display: inline-block;
    }

    details.project[open] .project-title::before {
      content: "×";
    }

    .project-summary {
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0;
      padding-left: 1.5rem;
    }

    .project-meta {
      font-size: 0.82rem;
      color: var(--subtle);
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding-top: 0.15rem;
    }

    .project-body {
      margin-top: 1.15rem;
      padding-top: 1.1rem;
      padding-left: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.94rem;
      color: var(--text);
    }

    .project-body p {
      margin: 0 0 0.85rem;
    }

    .project-body ul {
      margin: 0 0 1rem;
      padding-left: 1.2rem;
    }

    .project-body li {
      margin-bottom: 0.4rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.85rem;
    }

    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      background: var(--tag-bg);
      color: var(--muted);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }

    figure.media-card {
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #f9fafb;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    figure.media-card img,
    figure.media-card video {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: #ffffff;
      display: block;
      border-bottom: 1px solid var(--border);
    }

    figure.media-card figcaption {
      padding: 0.55rem 0.75rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .ext-link {
      display: inline-block;
      margin-top: 0.4rem;
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .ext-link:hover {
      text-decoration: underline;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.15rem 1.25rem;
    }

    .skill-group h3 {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
      color: var(--accent);
    }

    .skill-group p {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--subtle);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0
